<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativos de Engenharia com diversas aplicações">
    <meta name="keywords" content="engenharia,drenagem,saneamento,calculo">
    <meta name="author" content="Everton Jhons">
    <title>Aplicativos de Enegenharia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .topo {
            background-color: rgb(99, 57, 23);
            text-align: center;
            padding: 20px;
            color: lemonchiffon;
            font-size: large;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .menu {
            background-color: darkblue;
            overflow: hidden;
        }

        .menu a {
            color: beige;
            padding: 14px 16px;
            /*Posiciona na linha*/
            float: left;
            display: block;
            /*Remove o underline nos links*/
            text-decoration: none;
        }

        .items {
            display: flex;
        }

        .panels a {
            color: beige;
            padding: 14px;
            width: 40px;
            background-color: brown;
            text-decoration: none;
        }

        .section-tile {
            border-bottom: black 2px;
        }

        .item {
            padding: 14px 16px;
        }
    </style>
</head>

<body>
    <header class="topo">
        <h1>Aplicativos Engenharia</h1>
    </header>
    <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
    </nav>

    <section class="panels">
        <h2 class="section-title">Drenagem</h2>
        <div class="items">
            <div class="item">
                <a href="#">Calculadora de vazão</a>
            </div>
            <div class="item">
                <a href="#">Visualizador de IDF</a>
            </div>
            <div class="item">
                <a href="#">Cálculo de Condutos livres</a>
            </div>
            <div class="item">
                <a href="#">Cálculo de Sarjeta</a>
            </div>
        </div>
    </section>
    <hr>
    <footer>
        <a href="index.html">Voltar para a Principal</a>
    </footer>

</body>

</html>
